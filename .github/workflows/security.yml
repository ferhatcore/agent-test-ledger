name: Security regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Verify real Jest and Vitest adapters
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/runners" --no-save --no-audit --no-fund --ignore-scripts jest@30.5.2 vitest@5.1.0
          LEDGER_RUNNER_MODULES="$RUNNER_TEMP/runners/node_modules" npm test
      - run: npm pack --dry-run
