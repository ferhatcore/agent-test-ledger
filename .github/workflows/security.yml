name: Security regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: python
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check pytest==9.2.0
      - name: Install test runners
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/runners" --no-save --no-audit --no-fund --ignore-scripts jest@30.5.2 vitest@5.1.0
      - name: Verify runners, process cleanup and installed package
        shell: bash
        env:
          LEDGER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          LEDGER_RUNNER_MODULES="$RUNNER_TEMP/runners/node_modules" npm run verify
